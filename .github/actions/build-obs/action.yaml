name: Set Up and Build obs-studio
description: Builds obs-studio for specified architecture and build config

inputs:
  target:
    description: Build target for obs-studio
    required: true

  config:
    description: Build configuration
    required: false
    default: RelWithDebInfo

  codesign:
    description: Enable codesigning (macOS only)
    required: false
    default: 'false'

  codesignIdent:
    description: Developer ID for application codesigning (macOS only)
    required: false
    default: '-'

  codesignTeam:
    description: Team ID for application codesigning (macOS only)
    required: false
    default: ''

  provisioningProfileUUID:
    description: UUID of provisioning profile (macOS only)
    required: false
    default: ''

  workingDirectory:
    description: Working directory for packaging
    required: false
    default: ${{ github.workspace }}

runs:
  using: composite

  steps:

    # ============================================================
    # macOS
    # ============================================================

    - name: Run macOS Build
      if: runner.os == 'macOS'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CODESIGN_IDENT: ${{ inputs.codesignIdent }}
        CODESIGN_TEAM: ${{ inputs.codesignTeam }}
        PROVISIONING_PROFILE: ${{ inputs.provisioningProfileUUID }}
        OBS_VERSION_OVERRIDE: 30.0.0-lightspeed
      run: |
        : Run macOS Build

        local -a build_args=(
          --config ${{ inputs.config }}
          --target macos-${{ inputs.target }}
        )

        if (( ${+RUNNER_DEBUG} )); then
          build_args+=(--debug)
        fi

        if [[ '${{ inputs.codesign }}' == true ]]; then
          build_args+=(--codesign)
        fi

        git fetch origin --no-tags --no-recurse-submodules -q

        .github/scripts/build-macos ${build_args}


    # ============================================================
    # Linux dependencies
    # ============================================================

    - name: Install Dependencies 🛠️
      if: runner.os == 'Linux'
      shell: bash
      run: |
        : Install Dependencies 🛠️

        echo ::group::Install Dependencies

        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

        brew update

        brew install --quiet zsh

        echo ::endgroup::


    # ============================================================
    # Ubuntu
    # ============================================================

    - name: Run Ubuntu Build
      if: runner.os == 'Linux'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        OBS_VERSION_OVERRIDE: 30.0.0-lightspeed
      run: |
        : Run Ubuntu Build

        local -a build_args=(
          --config ${{ inputs.config }}
          --target ubuntu-${{ inputs.target }}
        )

        if (( ${+RUNNER_DEBUG} )); then
          build_args+=(--debug)
        fi

        git fetch origin --no-tags --no-recurse-submodules -q

        .github/scripts/build-ubuntu ${build_args}


    # ============================================================
    # Windows
    # ============================================================

    - name: Run Windows Build
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ inputs.workingDirectory }}
      env:
        OBS_VERSION_OVERRIDE: 30.0.0-lightspeed
      run: |
        # Run Windows Build

        $BuildArgs = @{
          Target = '${{ inputs.target }}'
          Configuration = '${{ inputs.config }}'
        }

        if ($Env:RUNNER_DEBUG -ne $null) {
          $BuildArgs += @{
            Debug = $true
          }
        }

        git fetch origin --no-tags --no-recurse-submodules -q

        .github/scripts/Build-Windows.ps1 @BuildArgs


    # ============================================================
    # Build Summary
    # ============================================================

    - name: Create Summary 📊
      if: runner.os == 'Linux'
      shell: zsh --no-rcs --errexit --pipefail {0}
      run: |
        : Create Summary 📊

        local -a ccache_data

        if (( ${+RUNNER_DEBUG} )); then
          setopt XTRACE
          ccache_data=("${(fA)$(ccache -s -vv)}")
        else
          ccache_data=("${(fA)$(ccache -s)}")
        fi

        print '### ${{ runner.os }} Ccache Stats (${{ inputs.target }})' >> "$GITHUB_STEP_SUMMARY"
        print '```' >> "$GITHUB_STEP_SUMMARY"

        for line (${ccache_data}); do
          print ${line} >> "$GITHUB_STEP_SUMMARY"
        done

        print '```' >> "$GITHUB_STEP_SUMMARY"